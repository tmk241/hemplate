[package]
name = "hemplate-derive"
version = "0.5.0"
edition = "2021"
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Derive macro for compiling Hemplate templates into Rust rendering code"
documentation = "https://docs.rs/hemplate-derive"
keywords = ["html", "template", "derive", "proc-macro"]
categories = ["template-engine", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

hemplate-core = { version = "0.4.0", path = "../hemplate-core" }

[dev-dependencies]
html5ever = "0.40.1"
hemplate-parser = { version = "0.3.0", path = "../hemplate-parser" }
hemplate-fmt = { version = "0.1.0", path = "../hemplate-fmt" }
hemplate-core = { version = "0.4.0", path = "../hemplate-core", features = ["surface"] }
