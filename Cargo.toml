[workspace]
resolver = "2"
members = [
    "hemplate",
    "hemplate-axum",
    "hemplate-core",
    "hemplate-derive",
    "hemplate-fmt",
    "hemplate-parser",
    "hemplate-runtime",
    "tree-sitter-hemplate",
    "tests/browser-vectors",
    "tests/default-runtime",
    "tests/wasm-runtime",
]

[workspace.package]
# One version for every Hemplate package: generated code, runtime and tooling
# are released together and pin each other exactly.
version = "0.6.0"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tmk241/hemplate"
rust-version = "1.91"
