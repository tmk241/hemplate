[workspace]
resolver = "2"
members = [
    "hemplate",
    "hemplate-axum",
    "hemplate-core",
    "hemplate-derive",
    "hemplate-parser",
    "hemplate-runtime",
    "tree-sitter-hemplate",
    "tests/default-runtime",
    "tests/wasm-runtime",
]

[workspace.package]
license = "MIT"
readme = "README.md"
repository = "https://github.com/tmk241/hemplate"
rust-version = "1.91"
