[package]
name = "tree-sitter-hemplate"
description = "Tree-sitter grammar for Hemplate templates"
version = "0.1.0"
license.workspace = true
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "hemplate"]
categories = ["parsing", "text-editors"]
repository.workspace = true
rust-version.workspace = true
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
    "LICENSE",
    "README.md",
    "THIRD_PARTY_LICENSES.md",
    "bindings/rust/build.rs",
    "bindings/rust/lib.rs",
    "grammar.js",
    "queries/*.scm",
    "src/grammar.json",
    "src/node-types.json",
    "src/parser.c",
    "src/scanner.c",
    "src/tag.h",
    "src/tree_sitter/*.h",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1.22"

[dev-dependencies]
tree-sitter = "0.25"
