[package]
name = "hemplate"
version = "0.3.0"
edition = "2021"
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Compile-time HTML templates for Rust"
documentation = "https://docs.rs/hemplate"
keywords = ["html", "template", "rendering", "web"]
categories = ["template-engine", "web-programming"]

[features]
default = ["derive", "host"]
derive = ["dep:hemplate-derive"]
host = ["dep:hemplate-core"]

[dependencies]
hemplate-runtime = { version = "0.2.0", path = "../hemplate-runtime" }
hemplate-core = { version = "0.2.0", path = "../hemplate-core", optional = true }
hemplate-derive = { version = "0.3.0", path = "../hemplate-derive", optional = true }

[dev-dependencies]
trybuild = "1"
