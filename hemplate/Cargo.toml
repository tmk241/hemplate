[package]
name = "hemplate"
version = "0.1.0"
edition = "2021"
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Compile-time HTML templates for Rust"
documentation = "https://docs.rs/hemplate"
keywords = ["html", "template", "rendering", "web"]
categories = ["template-engine", "web-programming"]

[dependencies]
hemplate-core = { version = "0.1.0", path = "../hemplate-core" }
hemplate-derive = { version = "0.1.0", path = "../hemplate-derive" }

[dev-dependencies]
trybuild = "1"
