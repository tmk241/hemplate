name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - run: cargo check --locked --workspace --all-targets --all-features
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check -p hemplate-wasm-runtime-test --target wasm32-unknown-unknown
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: licenses sources
  # The checked-in parser must be exactly what grammar.js generates, and the
  # grammar corpus must pass; cargo test only builds the generated parser.
  grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tree-sitter-hemplate
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global tree-sitter-cli@0.26.9
      - run: tree-sitter generate
      - run: git diff --exit-code -- src
      - run: tree-sitter test
